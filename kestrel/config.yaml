---
name: Kestrel
# The one version Kestrel's server and clients share, as in
# packages/core/src/Version.ts; CI checks they match
version: 0.5.20
slug: kestrel
description: Your cameras, recordings and events in one place
url: https://github.com/timmo001/kestrel
arch:
  - aarch64
  - amd64
image: ghcr.io/timmo001/kestrel-app
# Shares the host's network, so the mDNS announcement carries an address the
# home network can reach. Pairing guards port 7380.
host_network: true
# Home Assistant signs the user in, so the ingress port needs no pairing. It
# only answers the Supervisor.
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Kestrel
watchdog: http://[HOST]:7380/api/health
# Seconds to stop in, so each camera's recording finishes its file
timeout: 30
# Recordings go in Home Assistant's media folder, so they show in its media
# browser and stay out of the app's backups
map:
  - type: media
    read_only: false
environment:
  KESTREL_INGRESS_PORT: "8099"
  KESTREL_APP_OPTIONS: /data/options.json
  KESTREL_RECORDINGS: /media/kestrel
  KESTREL_NAME: Home Assistant
options:
  hide_sidebar: true
schema:
  hide_sidebar: bool
