---
name: Update app

# An app's release sends repository_dispatch (app-release) with its repository
# and tag once its image is pushed. Run it by hand for a first copy or a re-run.
# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types:
      - app-release
  workflow_dispatch:
    inputs:
      repository:
        description: "The app's repository, such as timmo001/triage"
        required: true
        type: string
      tag:
        description: "The release tag"
        required: true
        type: string

permissions:
  contents: read

# One update at a time, so two releases queue rather than race to push.
concurrency:
  group: update-app
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ github.event.client_payload.repository || inputs.repository }} to ${{ github.event.client_payload.tag || inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      # The Development ruleset blocks GITHUB_TOKEN from pushing to main, so
      # this pushes with an admin's token, which can bypass it.
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

      - name: Find the app
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error title=Invalid tag::'$TAG' isn't a release tag."
            exit 1
          fi
          # A repository can have more than one app, such as two versions on one image.
          folders="$(yq -r '[.apps | to_entries[] | select(.value.repository == strenv(REPOSITORY)) | .key] | join(" ")' apps.yml)"
          if [ -z "$folders" ]; then
            echo "::error title=Unknown app::$REPOSITORY isn't in apps.yml."
            exit 1
          fi
          printf 'FOLDERS=%s\nSOURCE=%s\n' "$folders" "$RUNNER_TEMP/source" >> "$GITHUB_ENV"

      - name: Check out the release
        run: git clone --quiet --depth 1 --branch "$TAG" "https://github.com/$REPOSITORY.git" "$SOURCE"

      # The Supervisor offers the version in config.yaml and pulls that image
      # tag, so only copy a stable release whose image exists.
      - name: Check the release, versions and images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" -R "$REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            echo "::error title=Prerelease::$TAG is a prerelease."
            exit 1
          fi
          names=()
          for folder in $FOLDERS; do
            path="$(FOLDER="$folder" yq -r '.apps[strenv(FOLDER)].path' apps.yml)"
            config="$SOURCE/$path/config.yaml"
            version="$(yq -r '.version' "$config")"
            if [ "$version" != "${TAG#v}" ]; then
              echo "::error title=Version mismatch::$path/config.yaml has $version, the tag is $TAG."
              exit 1
            fi
            image="$(yq -r '.image' "$config")"
            docker buildx imagetools inspect "$image:$version" > /dev/null
            names+=("$(yq -r '.name' "$config")")
          done
          name="$(printf '%s and ' "${names[@]}")"
          printf 'NAME=%s\nVERSION=%s\n' "${name% and }" "${TAG#v}" >> "$GITHUB_ENV"

      # CHANGELOG.md at the tag still holds the previous release's notes, so
      # take this release's notes instead. -L copies what links point to, as an
      # app folder can link to files in another. --checksum compares contents,
      # as both checkouts can share a modified time and a new version is often
      # the same size.
      - name: Copy the apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(gh release view "$TAG" -R "$REPOSITORY" --json body --jq .body)"
          for folder in $FOLDERS; do
            path="$(FOLDER="$folder" yq -r '.apps[strenv(FOLDER)].path' apps.yml)"
            mkdir -p "$folder"
            rsync -aL --checksum --delete --exclude CHANGELOG.md "$SOURCE/$path/" "$folder/"
            printf '%s\n' "$(printf '%s' "$notes" | tr -d '\r')" > "$folder/CHANGELOG.md"
          done

      - name: Commit
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          git add -A -- $FOLDERS
          if git diff --cached --quiet; then
            echo "$NAME $VERSION is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update $NAME to $VERSION"
          git push
