---
extends: default

# App folders are copied from each app's own repository, which lints them, and
# .mise holds the locks mise generates.
ignore: |
  .mise/
  triage/
  opencode/

rules:
  document-start:
    present: true
    level: error
  line-length: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
