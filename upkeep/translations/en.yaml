# The app's option names and descriptions in Home Assistant.
---
configuration:
  server_admin_token:
    name: Server admin token
    description: >-
      An admin token the server always accepts, at least 32 characters, for
      adding workers and admins with --server. It isn't stored or listed.
      Leave it empty once you've added an admin of your own.
  heals_per_day:
    name: Heals per day
    description: >-
      How many heals one job can have for each repository, or for itself, in
      any 24 hours. A repository past it has its heal held until one frees
      up; a job failing in itself is parked.
  keep_days:
    name: Days to keep runs
    description: >-
      How many days finished runs and their logs are kept.
  keep_runs:
    name: Runs to keep per job
    description: >-
      How many of each job's latest finished runs are kept however old.
  triage_url:
    name: Triage URL
    description: >-
      Triage's address, so failures are remembered as triage issues. Leave it
      empty to use the triage app from the same repository, when it's
      installed and running.
  triage_host_token:
    name: Triage host token
    description: >-
      A triage host token named upkeep, to send failures as events. Add one
      with `triage hosts add upkeep`. Set both tokens to use triage.
  triage_admin_token:
    name: Triage admin token
    description: >-
      A triage admin token for Upkeep, to read past fixes before a heal and
      resolve issues once fixed. Add one with `triage admins add upkeep`
      rather than using triage's server admin token.
  events_account_id:
    name: Events account ID
    description: >-
      The Cloudflare account the GitHub events queue is in. Set all three
      events options to take GitHub's events; without them, jobs run on their
      schedules alone.
  events_queue_id:
    name: Events queue ID
    description: >-
      The ID of the Cloudflare Queue the events Worker fills, with HTTP pull
      turned on.
  events_token:
    name: Events token
    description: >-
      A Cloudflare API token with Queues edit, to pull and acknowledge events.
  github_app_id:
    name: GitHub App ID
    description: >-
      The ID of the GitHub App the jobs' own GitHub calls run as, such as
      bumps and syncs, so they count against the App's rate limit. Heals and
      agents keep the worker's own login. Without it, every job uses the
      worker's login.
  github_app_key:
    name: GitHub App private key
    description: >-
      The App's private key: the .pem GitHub gives, pasted as it is, or the
      file in base64.
  github_app_account:
    name: GitHub App account
    description: >-
      The account whose installation to use, only needed when the App is
      installed on more than one.
